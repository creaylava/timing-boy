<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🌰 Empower 项目排期</title>
<style>
  :root{
    --bg:#f4f5f7; --card-bg:#ffffff; --text:#2e2a26; --muted:#8c8377;
    --accent:#c8662f; --border:#e2dbd1; --input-bg:#fdfcfa; --sidebar-bg:#ffffff;
    --bar-bg:#e9ecef; --today-bg:#fff3cd;
  }
  body.dark {
    --bg:#121212; --card-bg:#1e1e1e; --text:#e0e0e0; --muted:#9e9e9e;
    --accent:#e07b39; --border:#444444; --input-bg:#2d2d2d; --sidebar-bg:#1e1e1e;
    --bar-bg:#2d2d2d; --today-bg:#332b00;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    height:100vh; overflow:hidden; display:flex; flex-direction:column;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); transition:.3s;
  }
  header{
    display:flex; align-items:center; padding:10px 20px; background:var(--card-bg);
    border-bottom:1px solid var(--border); gap:10px; z-index:10; flex-shrink:0;
    box-shadow:0 2px 5px rgba(0,0,0,.05);
  }
  header h1{font-size:16px; font-weight:700; margin-right:auto;}
  .btn{
    border:1px solid var(--border); background:var(--card-bg); color:var(--text);
    padding:7px 14px; border-radius:8px; font-size:13px; cursor:pointer; transition:.15s; font-family:inherit;
    white-space:nowrap;
  }
  .btn:hover{background:var(--input-bg);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.primary:hover{opacity:.9;}
  .btn.danger{color:#d0453a; border-color:#f0cfcc;}
  .btn.icon{padding:7px 10px;}

  /* 排期表主容器 */
  .planner-container {
    flex:1; display:flex; overflow:hidden; position:relative;
  }
  
  /* 左侧任务信息栏 */
  .task-sidebar {
    width: 280px; flex-shrink: 0; background:var(--sidebar-bg);
    border-right: 2px solid var(--border); display: flex; flex-direction: column;
    overflow-y: auto; z-index: 5; box-shadow: 2px 0 5px rgba(0,0,0,.05);
  }
  .sidebar-header {
    height: 50px; display: flex; align-items: center; padding: 0 15px;
    font-weight: 700; font-size: 13px; border-bottom: 1px solid var(--border);
    background: var(--card-bg); position: sticky; top: 0; z-index: 6;
  }
  .task-item {
    height: 60px; display: flex; flex-direction: column; justify-content: center;
    padding: 0 15px; border-bottom: 1px solid var(--border); font-size: 13px;
    cursor: pointer; transition: background 0.15s;
  }
  .task-item:hover { background: var(--input-bg); }
  .task-item.active { background: rgba(200,102,47,.1); border-left: 3px solid var(--accent); }
  .task-name { font-weight: 600; margin-bottom: 3px; display: flex; justify-content: space-between; }
  .task-meta { font-size: 11px; color: var(--muted); display: flex; gap: 8px; }

  /* 右侧甘特图区域 */
  .gantt-viewport {
    flex: 1; overflow: auto; position: relative; background: var(--bg);
  }
  .gantt-canvas {
    display: flex; flex-direction: column; min-width: max-content;
  }
  
  /* 时间轴 */
  .timeline-header {
    height: 50px; display: flex; border-bottom: 1px solid var(--border);
    background: var(--card-bg); position: sticky; top: 0; z-index: 4;
  }
  .timeline-day {
    width: 40px; flex-shrink: 0; border-right: 1px solid var(--border);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 10px; color: var(--muted); line-height: 1.2;
  }
  .timeline-day.weekend { background: rgba(0,0,0,.03); }
  .timeline-day.today { background: var(--today-bg); color: var(--accent); font-weight: 700; }
  .timeline-day .month-label { font-size: 9px; color: var(--muted); }

  /* 任务行 */
  .task-row {
    height: 60px; display: flex; border-bottom: 1px solid var(--border);
    position: relative; transition: background 0.15s;
  }
  .task-row:hover { background: rgba(0,0,0,.02); }
  .task-row.active { background: rgba(200,102,47,.05); }
  
  /* 网格背景 */
  .grid-bg {
    position: absolute; inset: 0; display: flex; pointer-events: none;
  }
  .grid-cell {
    width: 40px; flex-shrink: 0; border-right: 1px solid var(--border);
  }
  .grid-cell.weekend { background: rgba(0,0,0,.02); }
  .grid-cell.today { background: var(--today-bg); }

  /* 任务条 */
  .task-bar {
    position: absolute; top: 15px; height: 30px; border-radius: 6px;
    background: var(--accent); color: #fff; font-size: 11px; padding: 0 8px;
    display: flex; align-items: center; justify-content: space-between;
    white-space: nowrap; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,.2);
    cursor: pointer; transition: transform .1s, box-shadow .1s;
  }
  .task-bar:hover { transform: scaleY(1.1); box-shadow: 0 4px 10px rgba(0,0,0,.3); z-index: 10; }
  .task-bar .progress-fill {
    position: absolute; left: 0; top: 0; bottom: 0; background: rgba(0,0,0,.2);
    border-radius: 6px 0 0 6px;
  }
  .task-bar .bar-text { position: relative; z-index: 2; }

  /* 弹窗 */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.45);
    display:none; align-items:center; justify-content:center;
    z-index:100; padding:20px;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--card-bg); border-radius:14px; width:100%; max-width:480px;
    padding:20px; box-shadow:0 20px 60px rgba(0,0,0,.25); max-height:90vh; overflow-y:auto;
    animation:pop .16s ease-out;
  }
  @keyframes pop{from{transform:translateY(8px); opacity:0;} to{transform:none; opacity:1;}}
  .m-title{font-size:17px; font-weight:600; margin-bottom:15px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px;}
  .modal input, .modal select, .modal textarea {
    width:100%; border:1px solid var(--border); border-radius:8px;
    padding:8px 10px; font-size:14px; font-family:inherit; color:var(--text);
    background:var(--input-bg); outline:none;
  }
  .modal input:focus, .modal select:focus { border-color:var(--accent); background:var(--card-bg); }
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .modal-actions{display:flex; gap:8px; margin-top:15px; align-items:center;}

  /* 移动端适配 */
  @media (max-width: 768px) {
    .task-sidebar { width: 160px; }
    .task-name { font-size: 12px; }
    .timeline-day { width: 30px; font-size: 9px; }
    .grid-cell { width: 30px; }
    .task-bar { font-size: 10px; padding: 0 4px; }
  }
</style>
</head>
<body>

<header>
  <h1>🌰 Empower 项目排期</h1>
  <button class="btn primary" id="addTaskBtn">＋ 新建任务</button>
  <button class="btn" id="exportBtn">导出Excel</button>
  <button class="btn icon" id="themeToggle" title="切换深色/浅色">🌙</button>
  <button class="btn danger" id="resetBtn">重置</button>
</header>

<div class="planner-container">
  <!-- 左侧任务信息 -->
  <div class="task-sidebar" id="taskSidebar">
    <div class="sidebar-header">任务列表</div>
    <!-- 动态生成 -->
  </div>

  <!-- 右侧甘特图 -->
  <div class="gantt-viewport" id="ganttViewport">
    <div class="gantt-canvas" id="ganttCanvas">
      <div class="timeline-header" id="timelineHeader"></div>
      <!-- 动态生成任务行 -->
    </div>
  </div>
</div>

<!-- 弹窗 -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="m-title" id="modalTitle">新建任务</div>
    <div class="field">
      <label>任务名称</label>
      <input id="mName" placeholder="如：方案设计、图纸审核">
    </div>
    <div class="grid2">
      <div class="field">
        <label>开始日期</label>
        <input type="date" id="mStart">
      </div>
      <div class="field">
        <label>结束日期</label>
        <input type="date" id="mEnd">
      </div>
    </div>
    <div class="grid2">
      <div class="field">
        <label>负责人</label>
        <input id="mOwner" placeholder="如：张三">
      </div>
      <div class="field">
        <label>进度 (%)</label>
        <input type="number" id="mProgress" min="0" max="100" value="0">
      </div>
    </div>
    <div class="field">
      <label>颜色标记</label>
      <select id="mColor">
        <option value="#c8662f">默认（橙色）</option>
        <option value="#3f9d7c">进行中（绿色）</option>
        <option value="#e8a33d">待办（黄色）</option>
        <option value="#e2574c">紧急（红色）</option>
        <option value="#6c5ce7">设计（紫色）</option>
        <option value="#0984e3">采购（蓝色）</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn danger" id="mDelete">删除</button>
      <div style="flex:1"></div>
      <button class="btn" id="mCancel">取消</button>
      <button class="btn primary" id="mSave">保存</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   数据层
   ========================================================= */
const STORAGE_KEY = 'empower-plan-v1';
const THEME_KEY = 'empower-plan-theme';
const uid = () => Math.random().toString(36).slice(2, 10);

function defaultData() {
  const today = new Date();
  const start = new Date(today.getFullYear(), today.getMonth(), 1);
  const end = new Date(today.getFullYear(), today.getMonth() + 2, 0); // 2个月的范围

  return {
    projectStart: start.toISOString().slice(0, 10),
    projectEnd: end.toISOString().slice(0, 10),
    tasks: [
      { id: uid(), name: '概念设计', start: start.toISOString().slice(0,10), end: new Date(today.getFullYear(), today.getMonth(), 10).toISOString().slice(0,10), progress: 100, owner: '张三', color: '#6c5ce7' },
      { id: uid(), name: '详细设计', start: new Date(today.getFullYear(), today.getMonth(), 11).toISOString().slice(0,10), end: new Date(today.getFullYear(), today.getMonth(), 25).toISOString().slice(0,10), progress: 60, owner: '李四', color: '#0984e3' },
      { id: uid(), name: '零件采购', start: new Date(today.getFullYear(), today.getMonth(), 20).toISOString().slice(0,10), end: new Date(today.getFullYear(), today.getMonth()+1, 10).toISOString().slice(0,10), progress: 20, owner: '王五', color: '#e8a33d' }
    ]
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { const d = JSON.parse(raw); if (d && d.tasks) return d; }
  } catch (e) {}
  return defaultData();
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { alert('存储空间不足！'); }
}

let state = loadState();
let editingId = null;
let currentProjectStart = new Date(state.projectStart);
let currentProjectEnd = new Date(state.projectEnd);

/* =========================================================
   主题切换
   ========================================================= */
const themeBtn = document.getElementById('themeToggle');
function applyTheme(theme) {
  if (theme === 'dark') { document.body.classList.add('dark'); themeBtn.textContent = '☀️'; }
  else { document.body.classList.remove('dark'); themeBtn.textContent = '🌙'; }
}
const savedTheme = localStorage.getItem(THEME_KEY);
if (savedTheme) { applyTheme(savedTheme); } else {
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(prefersDark ? 'dark' : 'light');
}
themeBtn.onclick = () => {
  const isDark = document.body.classList.contains('dark');
  const t = isDark ? 'light' : 'dark';
  applyTheme(t); localStorage.setItem(THEME_KEY, t);
};

/* =========================================================
   核心渲染逻辑
   ========================================================= */
function getDaysBetween(d1, d2) {
  return Math.ceil((d2 - d1) / (1000 * 60 * 60 * 24));
}

function formatDate(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function render() {
  // 1. 计算时间轴范围（至少今天在范围内）
  const today = new Date();
  today.setHours(0,0,0,0);
  
  let minDate = new Date(state.projectStart);
  let maxDate = new Date(state.projectEnd);
  if (today < minDate) minDate = new Date(today);
  if (today > maxDate) maxDate = new Date(today);
  
  // 往前推3天，往后推7天，让视野更舒服
  minDate.setDate(minDate.getDate() - 3);
  maxDate.setDate(maxDate.getDate() + 7);
  
  const totalDays = getDaysBetween(minDate, maxDate);
  
  // 2. 渲染左侧任务列表
  const sidebar = document.getElementById('taskSidebar');
  let sidebarHTML = '<div class="sidebar-header">任务列表</div>';
  state.tasks.forEach((task, idx) => {
    const start = new Date(task.start);
    const end = new Date(task.end);
    const days = getDaysBetween(start, end) + 1;
    sidebarHTML += `
      <div class="task-item" data-id="${task.id}" style="border-left: 4px solid ${task.color}">
        <div class="task-name">${task.name} <span style="font-weight:400; font-size:11px; color:var(--muted)">${task.progress}%</span></div>
        <div class="task-meta">
          <span>${task.owner || '未分配'}</span>
          <span>${formatDate(start).slice(5)} ~ ${formatDate(end).slice(5)} (${days}天)</span>
        </div>
      </div>
    `;
  });
  sidebar.innerHTML = sidebarHTML;

  // 3. 渲染右侧时间轴和任务条
  const header = document.getElementById('timelineHeader');
  let headerHTML = '';
  for (let i = 0; i < totalDays; i++) {
    const d = new Date(minDate);
    d.setDate(d.getDate() + i);
    const isWeekend = d.getDay() === 0 || d.getDay() === 6;
    const isToday = d.toDateString() === new Date().toDateString();
    const monthLabel = d.getDate() === 1 ? `${d.getMonth()+1}月` : '';
    headerHTML += `
      <div class="timeline-day ${isWeekend ? 'weekend' : ''} ${isToday ? 'today' : ''}">
        <div>${d.getDate()}</div>
        <div class="month-label">${monthLabel}</div>
      </div>
    `;
  }
  header.innerHTML = headerHTML;

  // 清除旧的行（保留header）
  const oldRows = document.querySelectorAll('.task-row');
  oldRows.forEach(r => r.remove());

  const canvas = document.getElementById('ganttCanvas');
  
  state.tasks.forEach((task, idx) => {
    const row = document.createElement('div');
    row.className = 'task-row';
    row.dataset.id = task.id;
    
    // 背景网格
    let bgHTML = '<div class="grid-bg">';
    for (let i = 0; i < totalDays; i++) {
      const d = new Date(minDate);
      d.setDate(d.getDate() + i);
      const isWeekend = d.getDay() === 0 || d.getDay() === 6;
      const isToday = d.toDateString() === new Date().toDateString();
      bgHTML += `<div class="grid-cell ${isWeekend ? 'weekend' : ''} ${isToday ? 'today' : ''}"></div>`;
    }
    bgHTML += '</div>';
    row.innerHTML = bgHTML;

    // 任务条计算
    const taskStart = new Date(task.start);
    const taskEnd = new Date(task.end);
    const offsetDays = getDaysBetween(minDate, taskStart);
    const durationDays = getDaysBetween(taskStart, taskEnd) + 1;
    
    // 限制在可见范围内
    const visibleOffset = Math.max(0, offsetDays);
    const visibleDuration = Math.min(durationDays - (visibleOffset - offsetDays), totalDays - visibleOffset);

    if (visibleDuration > 0) {
      const bar = document.createElement('div');
      bar.className = 'task-bar';
      const cellWidth = window.innerWidth <= 768 ? 30 : 40;
      bar.style.left = `${visibleOffset * cellWidth}px`;
      bar.style.width = `${visibleDuration * cellWidth}px`;
      bar.style.background = task.color;
      
      bar.innerHTML = `
        <div class="progress-fill" style="width: ${task.progress}%; background: rgba(0,0,0,0.25);"></div>
        <span class="bar-text">${task.name}</span>
        <span class="bar-text" style="font-size:10px; opacity:.8">${task.progress}%</span>
      `;
      row.appendChild(bar);
    }
    
    // 点击行打开编辑
    row.addEventListener('click', () => openEdit(task.id));
    canvas.appendChild(row);
  });

  // 同步高亮
  document.querySelectorAll('.task-item').forEach(el => {
    el.addEventListener('click', () => {
      document.querySelectorAll('.task-item').forEach(e => e.classList.remove('active'));
      document.querySelectorAll('.task-row').forEach(e => e.classList.remove('active'));
      el.classList.add('active');
      const row = document.querySelector(`.task-row[data-id="${el.dataset.id}"]`);
      if (row) row.classList.add('active');
    });
  });
}

/* =========================================================
   新建 / 编辑 / 删除
   ========================================================= */
const overlay = document.getElementById('overlay');
const mName = document.getElementById('mName');
const mStart = document.getElementById('mStart');
const mEnd = document.getElementById('mEnd');
const mOwner = document.getElementById('mOwner');
const mProgress = document.getElementById('mProgress');
const mColor = document.getElementById('mColor');

function openModal(title, task = null) {
  document.getElementById('modalTitle').textContent = title;
  if (task) {
    editingId = task.id;
    mName.value = task.name;
    mStart.value = task.start;
    mEnd.value = task.end;
    mOwner.value = task.owner || '';
    mProgress.value = task.progress || 0;
    mColor.value = task.color || '#c8662f';
  } else {
    editingId = null;
    const today = new Date();
    const nextWeek = new Date(today); nextWeek.setDate(today.getDate() + 6);
    mName.value = '';
    mStart.value = formatDate(today);
    mEnd.value = formatDate(nextWeek);
    mOwner.value = '';
    mProgress.value = 0;
    mColor.value = '#c8662f';
  }
  overlay.classList.add('show');
  setTimeout(() => mName.focus(), 30);
}

function closeModal() { overlay.classList.remove('show'); editingId = null; }

document.getElementById('addTaskBtn').onclick = () => openModal('新建任务');
document.getElementById('mCancel').onclick = closeModal;
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });

document.getElementById('mSave').onclick = () => {
  const name = mName.value.trim();
  if (!name) { alert('请输入任务名称'); return; }
  if (mStart.value > mEnd.value) { alert('开始日期不能晚于结束日期'); return; }

  if (editingId) {
    const task = state.tasks.find(t => t.id === editingId);
    if (task) {
      task.name = name; task.start = mStart.value; task.end = mEnd.value;
      task.owner = mOwner.value.trim(); task.progress = parseInt(mProgress.value) || 0;
      task.color = mColor.value;
    }
  } else {
    state.tasks.push({
      id: uid(), name: name, start: mStart.value, end: mEnd.value,
      owner: mOwner.value.trim(), progress: parseInt(mProgress.value) || 0,
      color: mColor.value
    });
  }
  closeModal(); render(); saveState();
};

document.getElementById('mDelete').onclick = () => {
  if (!editingId) { closeModal(); return; }
  if (!confirm('确定删除这个任务吗？')) return;
  state.tasks = state.tasks.filter(t => t.id !== editingId);
  closeModal(); render(); saveState();
};

function openEdit(id) {
  const task = state.tasks.find(t => t.id === id);
  if (task) openModal('编辑任务', task);
}

/* =========================================================
   导出 Excel
   ========================================================= */
document.getElementById('exportBtn').onclick = () => {
  let csvContent = "\uFEFF任务名称,开始日期,结束日期,负责人,进度,颜色\n";
  state.tasks.forEach(t => {
    csvContent += [`"${t.name}"`, `"${t.start}"`, `"${t.end}"`, `"${t.owner}"`, `"${t.progress}%"`, `"${t.color}"`].join(",") + "\n";
  });
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'Empower项目排期.csv';
  link.click();
  URL.revokeObjectURL(link.href);
};

/* =========================================================
   重置
   ========================================================= */
document.getElementById('resetBtn').onclick = () => {
  if (!confirm('确定清空所有数据并恢复示例吗？')) return;
  state = defaultData();
  currentProjectStart = new Date(state.projectStart);
  currentProjectEnd = new Date(state.projectEnd);
  render(); saveState();
};

/* =========================================================
   窗口大小改变时重新渲染
   ========================================================= */
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(render, 200);
});

/* =========================================================
   初始化
   ========================================================= */
render();
</script>
</body>
</html>
