<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🌰 Empower 项目排期</title>
<style>
  :root{
    --bg:#f4f5f7; --card-bg:#ffffff; --text:#2e2a26; --muted:#8c8377;
    --accent:#c8662f; --border:#e2dbd1; --input-bg:#fdfcfa; --sidebar-bg:#ffffff;
    --today-bg:#fff3cd; --sub-bg:#f9f6f2;
    --customer-color:#e2574c; --internal-color:#0984e3;
  }
  body.dark {
    --bg:#121212; --card-bg:#1e1e1e; --text:#e0e0e0; --muted:#9e9e9e;
    --accent:#e07b39; --border:#444444; --input-bg:#2d2d2d; --sidebar-bg:#1e1e1e;
    --today-bg:#332b00; --sub-bg:#222;
    --customer-color:#ff7675; --internal-color:#74b9ff;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    height:100vh; overflow:hidden; display:flex; flex-direction:column;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); transition:.3s;
  }
  header{
    display:flex; align-items:center; padding:10px 20px; background:var(--card-bg);
    border-bottom:1px solid var(--border); gap:10px; z-index:10; flex-shrink:0;
    box-shadow:0 2px 5px rgba(0,0,0,.05); flex-wrap: wrap;
  }
  header h1{font-size:16px; font-weight:700; margin-right:auto;}
  .btn{
    border:1px solid var(--border); background:var(--card-bg); color:var(--text);
    padding:7px 14px; border-radius:8px; font-size:13px; cursor:pointer; transition:.15s; font-family:inherit;
    white-space:nowrap;
  }
  .btn:hover{background:var(--input-bg);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.primary:hover{opacity:.9;}
  .btn.danger{color:#d0453a; border-color:#f0cfcc;}
  .btn.icon{padding:7px 10px;}
  .btn.small{padding:5px 10px; font-size:12px;}

  .project-selector {
    padding:6px 10px; border:1px solid var(--border); border-radius:8px;
    background:var(--input-bg); color:var(--text); font-size:13px; outline:none; max-width:180px;
    font-family:inherit;
  }

  .planner-container { flex:1; display:flex; overflow:hidden; position:relative; }
  .task-sidebar {
    width: 260px; flex-shrink: 0; background:var(--sidebar-bg);
    border-right: 2px solid var(--border); display: flex; flex-direction: column;
    overflow-y: auto; z-index: 5; box-shadow: 2px 0 5px rgba(0,0,0,.05);
  }
  .sidebar-header {
    height: 74px; display: flex; align-items: center; padding: 0 15px;
    font-weight: 700; font-size: 13px; border-bottom: 1px solid var(--border);
    background: var(--card-bg); position: sticky; top: 0; z-index: 6;
  }
  
  /* 任务行左侧 */
  .task-item {
    min-height: 60px; display: flex; align-items: center; justify-content: space-between;
    padding: 8px 10px 8px 15px; border-bottom: 1px solid var(--border); font-size: 13px;
    cursor: pointer; transition: background 0.15s;
  }
  .task-item:hover { background: var(--input-bg); }
  .task-item.active { background: rgba(200,102,47,.1); border-left: 4px solid var(--accent); }
  .task-info { flex: 1; min-width: 0; }
  .task-name { font-weight: 600; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .task-owner { font-size: 11px; color: var(--muted); }
  .task-move-btns { display: flex; flex-direction: column; gap: 2px; margin-left: 6px; }
  .move-btn {
    background: rgba(100,100,100,.08); color: var(--muted); border: none;
    width: 22px; height: 22px; border-radius: 4px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; transition: .15s;
  }
  .move-btn:hover:not(:disabled) { background: var(--accent); color: #fff; }
  .move-btn:disabled { opacity: 0.3; cursor: not-allowed; background: transparent; }

  /* 节点行左侧 */
  .milestone-item-row {
    min-height: 35px; display: flex; align-items: center;
    padding: 4px 15px 4px 30px; border-bottom: 1px solid var(--border);
    font-size: 12px; cursor: pointer; transition: background 0.15s;
    background: var(--sub-bg);
  }
  .milestone-item-row:hover { background: var(--input-bg); }
  .milestone-item-row.active { background: rgba(200,102,47,.1); border-left: 4px solid var(--accent); }
  .milestone-info { flex: 1; min-width: 0; display: flex; justify-content: space-between; align-items: center;}
  .milestone-name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .milestone-date { font-size: 10px; color: var(--muted); flex-shrink: 0; margin-left: 5px;}
  .milestone-type-icon { font-size: 10px; margin-right: 4px; }

  .gantt-viewport { flex: 1; overflow: auto; position: relative; background: var(--bg); }
  .gantt-canvas { display: flex; flex-direction: column; min-width: max-content; position: relative; }
  
  /* 时间轴双行 */
  .timeline-header {
    height: 74px; display: flex; flex-direction: column; 
    border-bottom: 1px solid var(--border);
    background: var(--card-bg); position: sticky; top: 0; z-index: 4;
  }
  .timeline-week-row {
    height: 24px; display: flex; border-bottom: 1px solid var(--border);
  }
  .timeline-week-cell {
    width: 40px; flex-shrink: 0; border-right: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; color: var(--accent); font-weight: 700;
  }
  .timeline-day-row {
    height: 50px; display: flex;
  }
  .timeline-day {
    width: 40px; flex-shrink: 0; border-right: 1px solid var(--border);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 10px; color: var(--muted); line-height: 1.2;
  }
  .timeline-day.weekend { background: rgba(0,0,0,.03); }
  .timeline-day.today { background: var(--today-bg); color: var(--accent); font-weight: 700; }
  .timeline-day .month-label { font-size: 9px; color: var(--muted); }

  #dependencyLayer {
    position: absolute; top: 74px; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 1; overflow: visible;
  }

  .task-row {
    height: 60px; display: flex; border-bottom: 1px solid var(--border);
    position: relative; transition: background 0.15s; z-index: 2;
  }
  .task-row:hover { background: rgba(0,0,0,.02); }
  .task-row.active { background: rgba(200,102,47,.05); }

  /* 节点行右侧 */
  .milestone-row {
    height: 35px; display: flex; border-bottom: 1px solid var(--border);
    position: relative; transition: background 0.15s; z-index: 2;
    background: var(--sub-bg);
  }
  .milestone-row:hover { background: var(--input-bg); }
  .milestone-row.active { background: rgba(200,102,47,.05); }
  
  .grid-bg { position: absolute; inset: 0; display: flex; pointer-events: none; z-index: 0; }
  .grid-cell { width: 40px; flex-shrink: 0; border-right: 1px solid var(--border); }
  .grid-cell.weekend { background: rgba(0,0,0,.02); }
  .grid-cell.today { background: var(--today-bg); }

  .task-bar {
    position: absolute; top: 8px; height: 22px; border-radius: 4px;
    background: var(--accent); color: #fff; font-size: 11px; padding: 0 6px;
    display: flex; align-items: center; justify-content: space-between;
    white-space: nowrap; overflow: visible; box-shadow: 0 1px 3px rgba(0,0,0,.2);
    cursor: pointer; transition: transform .1s; z-index: 3;
  }
  .task-bar.phase2 { top: 32px; height: 18px; font-size: 10px; opacity: .95; border-radius: 3px; }
  .task-bar:hover { transform: scaleY(1.1); box-shadow: 0 3px 8px rgba(0,0,0,.3); z-index: 10; }
  .task-bar .progress-fill {
    position: absolute; left: 0; top: 0; bottom: 0; background: rgba(0,0,0,.2);
    border-radius: 4px 0 0 4px; z-index: 1;
  }
  .task-bar .bar-text { position: relative; z-index: 3; text-shadow: 0 1px 2px rgba(0,0,0,.5); }

  /* 独立节点样式 */
  .milestone-marker {
    position: absolute; top: 50%; transform: translate(-50%, -50%) rotate(45deg);
    width: 10px; height: 10px; background: #fff; border: 2px solid #333;
    z-index: 5; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.3);
    transition: transform 0.2s;
  }
  .milestone-marker:hover { transform: translate(-50%, -50%) rotate(45deg) scale(1.4); z-index: 20; }
  .milestone-marker.customer { border-color: var(--customer-color); }
  .milestone-marker.internal { border-color: var(--internal-color); }
  .milestone-marker::after {
    content: attr(data-name); position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,.85); color: #fff; padding: 3px 6px; border-radius: 4px;
    font-size: 10px; white-space: nowrap; display: none; pointer-events: none;
    font-family: sans-serif; z-index: 100;
  }
  .milestone-marker:hover::after { display: block; }

  .overlay{ position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; z-index:100; padding:20px; }
  .overlay.show{display:flex;}
  .modal{
    background:var(--card-bg); border-radius:14px; width:100%; max-width:480px;
    padding:20px; box-shadow:0 20px 60px rgba(0,0,0,.25); max-height:90vh; overflow-y:auto;
    animation:pop .16s ease-out;
  }
  @keyframes pop{from{transform:translateY(8px); opacity:0;} to{transform:none; opacity:1;}}
  .m-title{font-size:17px; font-weight:600; margin-bottom:15px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px;}
  .modal input, .modal select, .modal textarea {
    width:100%; border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:14px;
    font-family:inherit; color:var(--text); background:var(--input-bg); outline:none; transition:.15s;
  }
  .modal input:focus, .modal select:focus { border-color:var(--accent); background:var(--card-bg); }
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .modal-actions{display:flex; gap:8px; margin-top:15px; align-items:center;}

  .milestone-list { border: 1px solid var(--border); border-radius: 8px; padding: 8px; background: var(--input-bg); max-height: 120px; overflow-y: auto; margin-bottom: 5px; }
  .milestone-item { display: flex; gap: 5px; margin-bottom: 6px; align-items: center; }
  .milestone-item input[type="text"] { flex: 1; padding: 4px 6px; font-size: 12px; }
  .milestone-item input[type="date"] { width: 105px; padding: 4px 6px; font-size: 12px; }
  .milestone-item select { width: 70px; padding: 4px 6px; font-size: 12px; }
  .milestone-item .remove-ms { color: #d0453a; background: none; border: none; font-size: 16px; cursor: pointer; padding: 0 4px; }

  @media (max-width: 768px) {
    .task-sidebar { width: 180px; }
    .task-name { font-size: 12px; }
    .task-owner { font-size: 10px; }
    .milestone-name { font-size: 10px; }
    .milestone-date { font-size: 9px; }
    .timeline-week-cell { width: 30px; font-size: 8px; }
    .timeline-day { width: 30px; font-size: 9px; }
    .grid-cell { width: 30px; }
    .task-bar { font-size: 10px; padding: 0 4px; }
    .task-bar.phase2 { font-size: 9px; }
    .milestone-marker { width: 8px; height: 8px; }
    header h1 { display: none; }
    .project-selector { width: 100px; font-size: 12px; }
  }
</style>
</head>
<body>

<header>
  <h1>🌰 Empower</h1>
  <select class="project-selector" id="projectSelect"></select>
  <button class="btn small" id="addProjectBtn">＋ 项目</button>
  <button class="btn primary" id="addTaskBtn">＋ 任务</button>
  <button class="btn small" id="addNodeBtn" style="border-color:var(--accent); color:var(--accent);">＋ 节点</button>
  
  <div style="flex:1"></div>
  
  <button class="btn small" id="backupBtn">📥 备份JSON</button>
  <button class="btn small" id="importBtn">📤 导入JSON</button>
  <input type="file" id="importFileInput" accept=".json" style="display:none;">
  
  <button class="btn icon" id="themeToggle" title="切换深色/浅色">🌙</button>
  <button class="btn danger" id="resetBtn">重置</button>
</header>

<div class="planner-container">
  <div class="task-sidebar" id="taskSidebar">
    <div class="sidebar-header">任务列表</div>
  </div>
  <div class="gantt-viewport" id="ganttViewport">
    <div class="gantt-canvas" id="ganttCanvas">
      <div class="timeline-header" id="timelineHeader">
        <div class="timeline-week-row" id="timelineWeekHeader"></div>
        <div class="timeline-day-row" id="timelineDayHeader"></div>
      </div>
      <svg id="dependencyLayer"></svg>
    </div>
  </div>
</div>

<!-- 任务弹窗 -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="m-title" id="modalTitle">新建任务</div>
    <div class="field">
      <label>任务名称</label>
      <input id="mName" placeholder="如：方案设计、图纸审核">
    </div>
    <div class="grid2">
      <div class="field"><label>阶段1 开始</label><input type="date" id="mStart"></div>
      <div class="field"><label>阶段1 结束</label><input type="date" id="mEnd"></div>
    </div>
    <div class="grid2">
      <div class="field"><label>阶段2 开始（选填）</label><input type="date" id="mStart2"></div>
      <div class="field"><label>阶段2 结束（选填）</label><input type="date" id="mEnd2"></div>
    </div>
    <div class="grid2">
      <div class="field"><label>负责人</label><input id="mOwner" placeholder="如：张三"></div>
      <div class="field"><label>进度 (%)</label><input type="number" id="mProgress" min="0" max="100" value="0"></div>
    </div>
    <div class="field">
      <label>前置任务（依赖关系 A → B）</label>
      <select id="mDependency"><option value="">无依赖</option></select>
    </div>
    <div class="field">
      <label>颜色标记</label>
      <select id="mColor">
        <option value="#c8662f">默认（橙色）</option>
        <option value="#3f9d7c">进行中（绿色）</option>
        <option value="#e8a33d">待办（黄色）</option>
        <option value="#e2574c">紧急（红色）</option>
        <option value="#6c5ce7">设计（紫色）</option>
        <option value="#0984e3">采购（蓝色）</option>
      </select>
    </div>
    <div class="field">
      <label>关键节点（里程碑）</label>
      <div class="milestone-list" id="milestoneList"></div>
      <button type="button" class="btn small" id="addMilestoneBtn">＋ 添加节点</button>
    </div>
    <div class="modal-actions">
      <button class="btn danger" id="mDelete">删除</button>
      <div style="flex:1"></div>
      <button class="btn" id="mCancel">取消</button>
      <button class="btn primary" id="mSave">保存</button>
    </div>
  </div>
</div>

<!-- 独立添加节点弹窗 -->
<div class="overlay" id="nodeOverlay">
  <div class="modal">
    <div class="m-title">添加节点（追踪客户节点）</div>
    <div class="field">
      <label>选择所属任务</label>
      <select id="nodeTaskSelect"></select>
    </div>
    <div class="field">
      <label>节点类型</label>
      <select id="nodeType">
        <option value="customer">客户节点</option>
        <option value="internal">内部节点</option>
      </select>
    </div>
    <div class="field">
      <label>节点名称</label>
      <input id="nodeName" placeholder="如：客户确认、初版图纸评审">
    </div>
    <div class="field">
      <label>节点日期</label>
      <input type="date" id="nodeDate">
    </div>
    <div class="modal-actions">
      <button class="btn" id="nodeCancel">取消</button>
      <button class="btn primary" id="nodeSave">保存节点</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   数据层
   ========================================================= */
const STORAGE_KEY = 'empower-plan-v1';
const THEME_KEY = 'empower-plan-theme';
const uid = () => Math.random().toString(36).slice(2, 10);

function defaultData() {
  const today = new Date();
  const start = new Date(today.getFullYear(), today.getMonth(), 1);
  return {
    projects: [
      {
        id: uid(), name: '默认项目',
        tasks: [
          { 
            id: uid(), name: '概念设计', 
            start: start.toISOString().slice(0,10), 
            end: new Date(today.getFullYear(), today.getMonth(), 10).toISOString().slice(0,10), 
            start2: '', end2: '', progress: 100, owner: '张三', color: '#6c5ce7', dependencyId: '',
            milestones: [
              { name: '方案评审', date: new Date(today.getFullYear(), today.getMonth(), 8).toISOString().slice(0,10), type: 'customer' },
              { name: '内部初稿', date: new Date(today.getFullYear(), today.getMonth(), 5).toISOString().slice(0,10), type: 'internal' }
            ]
          },
          { 
            id: uid(), name: '详细设计', 
            start: new Date(today.getFullYear(), today.getMonth(), 12).toISOString().slice(0,10), 
            end: new Date(today.getFullYear(), today.getMonth(), 25).toISOString().slice(0,10), 
            start2: '', end2: '', progress: 60, owner: '李四', color: '#0984e3', dependencyId: '', 
            milestones: [{ name: '图纸下发', date: new Date(today.getFullYear(), today.getMonth(), 22).toISOString().slice(0,10), type: 'customer' }]
          }
        ]
      }
    ],
    currentProjectId: null
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { 
      const d = JSON.parse(raw); 
      if (d && d.projects && d.projects.length > 0) {
        if (!d.currentProjectId) d.currentProjectId = d.projects[0].id;
        // 兼容旧数据，补充 type
        d.projects.forEach(p => {
          p.tasks.forEach(t => {
            if (t.milestones) {
              t.milestones.forEach(m => { if (!m.type) m.type = 'customer'; });
            }
          });
        });
        return d; 
      }
    }
  } catch (e) {}
  const def = defaultData();
  def.currentProjectId = def.projects[0].id;
  return def;
}
function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { alert('存储空间不足！'); } }

let state = loadState();
let editingId = null;

function getCurrentProject() {
  let proj = state.projects.find(p => p.id === state.currentProjectId);
  if (!proj) {
    proj = state.projects[0];
    if (proj) state.currentProjectId = proj.id;
  }
  return proj;
}

/* =========================================================
   主题切换
   ========================================================= */
const themeBtn = document.getElementById('themeToggle');
function applyTheme(theme) {
  if (theme === 'dark') { document.body.classList.add('dark'); themeBtn.textContent = '☀️'; }
  else { document.body.classList.remove('dark'); themeBtn.textContent = '🌙'; }
}
const savedTheme = localStorage.getItem(THEME_KEY);
if (savedTheme) { applyTheme(savedTheme); } else {
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(prefersDark ? 'dark' : 'light');
}
themeBtn.onclick = () => {
  const isDark = document.body.classList.contains('dark');
  const t = isDark ? 'light' : 'dark';
  applyTheme(t); localStorage.setItem(THEME_KEY, t);
};

/* =========================================================
   核心渲染逻辑（周数 + 节点分类独立成行）
   ========================================================= */
function getDaysBetween(d1, d2) { return Math.ceil((d2 - d1) / (1000 * 60 * 60 * 24)); }
function formatDate(date) {
  const y = date.getFullYear(); const m = String(date.getMonth() + 1).padStart(2, '0'); const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// 获取某天是当年的第几周
function getWeekNumber(d) {
  d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
  var yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  var weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
  return weekNo;
}

function render() {
  const currentProj = getCurrentProject();
  if (!currentProj) {
    document.getElementById('taskSidebar').innerHTML = '<div class="sidebar-header">任务列表</div><div style="padding:20px;font-size:12px;color:#888;">请先点击上方“＋ 项目”</div>';
    document.getElementById('timelineWeekHeader').innerHTML = '';
    document.getElementById('timelineDayHeader').innerHTML = '';
    document.querySelectorAll('.task-row, .milestone-row').forEach(r => r.remove());
    return;
  }

  const today = new Date(); today.setHours(0,0,0,0);
  let minDate = new Date(); let maxDate = new Date();
  if (currentProj.tasks.length > 0) {
    minDate = new Date(currentProj.tasks[0].start);
    maxDate = new Date(currentProj.tasks[0].end);
    currentProj.tasks.forEach(t => {
      if (new Date(t.start) < minDate) minDate = new Date(t.start);
      if (new Date(t.end) > maxDate) maxDate = new Date(t.end);
      if (t.start2 && new Date(t.start2) < minDate) minDate = new Date(t.start2);
      if (t.end2 && new Date(t.end2) > maxDate) maxDate = new Date(t.end2);
    });
  } else {
    minDate = new Date(today); minDate.setDate(today.getDate() - 3);
    maxDate = new Date(today); maxDate.setDate(today.getDate() + 7);
  }
  if (today < minDate) minDate = new Date(today);
  if (today > maxDate) maxDate = new Date(today);
  minDate.setDate(minDate.getDate() - 3);
  maxDate.setDate(maxDate.getDate() + 7);
  
  const totalDays = getDaysBetween(minDate, maxDate);
  const cellWidth = window.innerWidth <= 768 ? 30 : 40;

  // 构建行数据结构：任务行 + 客户节点行 + 内部节点行
  const renderRows = [];
  currentProj.tasks.forEach(task => {
    renderRows.push({ type: 'task', task: task, id: task.id });
    
    // 筛选客户节点
    const customerMilestones = (task.milestones || []).filter(m => m.type === 'customer' || !m.type);
    customerMilestones.forEach(ms => {
      renderRows.push({ type: 'milestone', task: task, ms: ms, milestoneType: 'customer', id: 'ms-' + task.id + '-' + ms.name + '-' + ms.date });
    });
    
    // 筛选内部节点
    const internalMilestones = (task.milestones || []).filter(m => m.type === 'internal');
    internalMilestones.forEach(ms => {
      renderRows.push({ type: 'milestone', task: task, ms: ms, milestoneType: 'internal', id: 'ms-' + task.id + '-' + ms.name + '-' + ms.date });
    });
  });

  // 1. 左侧列表
  const sidebar = document.getElementById('taskSidebar');
  let sidebarHTML = '<div class="sidebar-header">任务列表</div>';
  renderRows.forEach((row, index) => {
    if (row.type === 'task') {
      const task = row.task;
      const taskIndex = currentProj.tasks.findIndex(t => t.id === task.id);
      const isFirstTask = taskIndex === 0;
      const isLastTask = taskIndex === currentProj.tasks.length - 1;
      
      sidebarHTML += `
        <div class="task-item" data-id="${task.id}" style="border-left: 4px solid ${task.color}">
          <div class="task-info">
            <div class="task-name">${esc(task.name)}</div>
            <div class="task-owner">${esc(task.owner || '未分配')}</div>
          </div>
          <div class="task-move-btns">
            <button class="move-btn" data-act="move-task-up" data-id="${task.id}" ${isFirstTask ? 'disabled' : ''} title="上移">↑</button>
            <button class="move-btn" data-act="move-task-down" data-id="${task.id}" ${isLastTask ? 'disabled' : ''} title="下移">↓</button>
          </div>
        </div>
      `;
    } else {
      const ms = row.ms;
      const isCustomer = row.milestoneType === 'customer';
      sidebarHTML += `
        <div class="milestone-item-row" data-id="${row.id}" data-task-id="${row.task.id}">
          <div class="milestone-info">
            <div class="milestone-name">
              <span class="milestone-type-icon" style="color: ${isCustomer ? 'var(--customer-color)' : 'var(--internal-color)'}">
                ${isCustomer ? '👤' : '⚙️'}
              </span>
              ${esc(ms.name)}
            </div>
            <div class="milestone-date">${esc(ms.date)}</div>
          </div>
        </div>
      `;
    }
  });
  sidebar.innerHTML = sidebarHTML;

  // 2. 时间轴（周数行 + 日期行）
  const weekHeader = document.getElementById('timelineWeekHeader');
  const dayHeader = document.getElementById('timelineDayHeader');
  let weekHTML = '';
  let dayHTML = '';
  
  let lastWeek = -1;
  for (let i = 0; i < totalDays; i++) {
    const d = new Date(minDate); d.setDate(d.getDate() + i);
    const weekNo = getWeekNumber(d);
    const isWeekend = d.getDay() === 0 || d.getDay() === 6;
    const isToday = d.toDateString() === new Date().toDateString();
    const monthLabel = d.getDate() === 1 ? `${d.getMonth()+1}月` : '';
    
    // 周数行：只有周数变化时才显示文字
    if (weekNo !== lastWeek) {
      weekHTML += `<div class="timeline-week-cell">第${weekNo}周</div>`;
      lastWeek = weekNo;
    } else {
      weekHTML += `<div class="timeline-week-cell"></div>`;
    }
    
    dayHTML += `
      <div class="timeline-day ${isWeekend ? 'weekend' : ''} ${isToday ? 'today' : ''}">
        <div>${d.getDate()}</div>
        <div class="month-label">${monthLabel}</div>
      </div>
    `;
  }
  weekHeader.innerHTML = weekHTML;
  dayHeader.innerHTML = dayHTML;

  document.querySelectorAll('.task-row, .milestone-row').forEach(r => r.remove());
  const svgLayer = document.getElementById('dependencyLayer');
  svgLayer.innerHTML = '';
  const canvas = document.getElementById('ganttCanvas');
  
  const taskGeometry = {};
  let currentY = 74; // 时间轴总高度 74px

  renderRows.forEach((row) => {
    const rowEl = document.createElement('div');
    let rowHeight = 0;

    if (row.type === 'task') {
      rowEl.className = 'task-row'; rowEl.dataset.id = row.id;
      rowHeight = 60;
    } else {
      rowEl.className = 'milestone-row'; rowEl.dataset.id = row.id;
      rowHeight = 35;
    }
    
    rowEl.style.height = rowHeight + 'px';
    rowEl.style.top = currentY + 'px';
    
    // 背景网格
    let bgHTML = '<div class="grid-bg">';
    for (let i = 0; i < totalDays; i++) {
      const d = new Date(minDate); d.setDate(d.getDate() + i);
      const isWeekend = d.getDay() === 0 || d.getDay() === 6;
      const isToday = d.toDateString() === new Date().toDateString();
      bgHTML += `<div class="grid-cell ${isWeekend ? 'weekend' : ''} ${isToday ? 'today' : ''}"></div>`;
    }
    bgHTML += '</div>';
    rowEl.innerHTML = bgHTML;

    if (row.type === 'task') {
      const task = row.task;
      const taskStart = new Date(task.start); const taskEnd = new Date(task.end);
      const offsetDays = getDaysBetween(minDate, taskStart);
      const durationDays = getDaysBetween(taskStart, taskEnd) + 1;
      const visibleOffset = Math.max(0, offsetDays);
      const visibleDuration = Math.min(durationDays - (visibleOffset - offsetDays), totalDays - visibleOffset);

      let phase1RightX = 0;
      if (visibleDuration > 0) {
        const bar = document.createElement('div');
        bar.className = 'task-bar phase1';
        bar.style.left = `${visibleOffset * cellWidth}px`;
        bar.style.width = `${visibleDuration * cellWidth}px`;
        bar.style.background = task.color;
        bar.innerHTML = `
          <div class="progress-fill" style="width: ${task.progress}%; background: rgba(0,0,0,0.25);"></div>
          <span class="bar-text">${esc(task.name)}</span>
          <span class="bar-text" style="font-size:10px; opacity:.8">${task.progress}%</span>
        `;
        phase1RightX = (visibleOffset + visibleDuration) * cellWidth;
        rowEl.appendChild(bar);
      }

      let phase2RightX = 0;
      if (task.start2 && task.end2) {
        const t2Start = new Date(task.start2); const t2End = new Date(task.end2);
        const o2Days = getDaysBetween(minDate, t2Start);
        const d2Days = getDaysBetween(t2Start, t2End) + 1;
        const v2Offset = Math.max(0, o2Days);
        const v2Duration = Math.min(d2Days - (v2Offset - o2Days), totalDays - v2Offset);
        if (v2Duration > 0) {
          const bar2 = document.createElement('div');
          bar2.className = 'task-bar phase2';
          bar2.style.left = `${v2Offset * cellWidth}px`;
          bar2.style.width = `${v2Duration * cellWidth}px`;
          bar2.style.background = task.color + 'cc';
          bar2.innerHTML = `<span class="bar-text">阶段2</span>`;
          phase2RightX = (v2Offset + v2Duration) * cellWidth;
          rowEl.appendChild(bar2);
        }
      }

      taskGeometry[task.id] = {
        startX: offsetDays * cellWidth,
        phase1EndX: phase1RightX,
        phase2EndX: phase2RightX,
        yCenter: currentY + rowHeight / 2
      };
      
      rowEl.addEventListener('click', () => openEdit(task.id));

    } else {
      // 节点行
      const task = row.task;
      const ms = row.ms;
      const isCustomer = row.milestoneType === 'customer';
      
      const msDate = new Date(ms.date);
      const msOffsetDays = getDaysBetween(minDate, msDate);
      if (msOffsetDays >= 0 && msOffsetDays <= totalDays) {
        const marker = document.createElement('div');
        marker.className = `milestone-marker ${isCustomer ? 'customer' : 'internal'}`;
        marker.setAttribute('data-name', `${ms.name} (${ms.date.slice(5)})`);
        marker.style.left = `${msOffsetDays * cellWidth}px`;
        marker.style.top = '50%'; 
        rowEl.appendChild(marker);
      }
    }
    
    canvas.appendChild(rowEl);
    currentY += rowHeight;
  });

  canvas.style.height = (currentY + 20) + 'px';

  // 3. 绘制依赖线 (A → B)
  currentProj.tasks.forEach(task => {
    if (!task.dependencyId) return;
    const preId = task.dependencyId;
    const preGeo = taskGeometry[preId];
    const curGeo = taskGeometry[task.id];
    if (!preGeo || !curGeo) return;

    let startX = preGeo.phase2EndX > 0 ? preGeo.phase2EndX : preGeo.phase1EndX;
    if (startX === 0) return;
    const startY = preGeo.yCenter - 74; // 减去时间轴高度
    const endX = curGeo.startX;
    const endY = curGeo.yCenter - 74;

    const midX = startX + 10;
    const pathD = `M ${startX} ${startY} H ${midX} V ${endY} H ${endX - 5}`;
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', pathD);
    path.setAttribute('stroke', 'var(--muted)');
    path.setAttribute('stroke-width', '2');
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke-dasharray', '4,2');
    svgLayer.appendChild(path);

    const arrow = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    arrow.setAttribute('points', `${endX-5},${endY-4} ${endX},${endY} ${endX-5},${endY+4}`);
    arrow.setAttribute('fill', 'var(--muted)');
    svgLayer.appendChild(arrow);
  });

  // 4. 左侧高亮联动
  const allLeftRows = document.querySelectorAll('.task-item, .milestone-item-row');
  allLeftRows.forEach(el => {
    el.addEventListener('click', () => {
      allLeftRows.forEach(e => e.classList.remove('active'));
      document.querySelectorAll('.task-row, .milestone-row').forEach(e => e.classList.remove('active'));
      el.classList.add('active');
      const rowId = el.dataset.id;
      let targetRow;
      if (el.classList.contains('milestone-item-row')) {
        targetRow = document.querySelector(`.milestone-row[data-id="${rowId}"]`);
      } else {
        targetRow = document.querySelector(`.task-row[data-id="${rowId}"]`);
      }
      if (targetRow) targetRow.classList.add('active');
    });
  });

  // 5. 垂直滚动同步
  const sidebarEl = document.getElementById('taskSidebar');
  const viewportEl = document.getElementById('ganttViewport');
  
  sidebarEl.onscroll = null;
  viewportEl.onscroll = null;
  
  sidebarEl.addEventListener('scroll', () => {
    viewportEl.scrollTop = sidebarEl.scrollTop;
  });
  viewportEl.addEventListener('scroll', () => {
    sidebarEl.scrollTop = viewportEl.scrollTop;
  });
}

/* =========================================================
   任务上下移动
   ========================================================= */
function moveTaskPriority(taskId, direction) {
  const currentProj = getCurrentProject();
  const tasks = currentProj.tasks;
  const index = tasks.findIndex(t => t.id === taskId);
  if (index === -1) return;
  const targetIndex = index + direction;
  if (targetIndex < 0 || targetIndex >= tasks.length) return;
  const temp = tasks[index];
  tasks[index] = tasks[targetIndex];
  tasks[targetIndex] = temp;
  render();
  saveState();
}

document.getElementById('taskSidebar').addEventListener('click', (e) => {
  const upBtn = e.target.closest('[data-act="move-task-up"]');
  if (upBtn) { e.stopPropagation(); moveTaskPriority(upBtn.dataset.id, -1); return; }
  const downBtn = e.target.closest('[data-act="move-task-down"]');
  if (downBtn) { e.stopPropagation(); moveTaskPriority(downBtn.dataset.id, 1); return; }
});

/* =========================================================
   任务新增/编辑/删除
   ========================================================= */
const overlay = document.getElementById('overlay');
const mName = document.getElementById('mName');
const mStart = document.getElementById('mStart');
const mEnd = document.getElementById('mEnd');
const mStart2 = document.getElementById('mStart2');
const mEnd2 = document.getElementById('mEnd2');
const mOwner = document.getElementById('mOwner');
const mProgress = document.getElementById('mProgress');
const mColor = document.getElementById('mColor');
const mDependency = document.getElementById('mDependency');
const milestoneList = document.getElementById('milestoneList');

function renderMilestones(milestones) {
  milestoneList.innerHTML = '';
  milestones.forEach((ms, index) => {
    const div = document.createElement('div');
    div.className = 'milestone-item';
    div.innerHTML = `
      <input type="text" placeholder="节点名称" value="${ms.name || ''}" data-index="${index}" class="ms-name">
      <input type="date" value="${ms.date || ''}" data-index="${index}" class="ms-date">
      <select class="ms-type" data-index="${index}">
        <option value="customer" ${ms.type === 'customer' || !ms.type ? 'selected' : ''}>客户</option>
        <option value="internal" ${ms.type === 'internal' ? 'selected' : ''}>内部</option>
      </select>
      <button type="button" class="remove-ms" data-index="${index}">✕</button>
    `;
    milestoneList.appendChild(div);
  });
}
function collectMilestones() {
  const items = milestoneList.querySelectorAll('.milestone-item');
  const msArray = [];
  items.forEach(item => {
    const name = item.querySelector('.ms-name').value.trim();
    const date = item.querySelector('.ms-date').value;
    const type = item.querySelector('.ms-type').value;
    if (name && date) msArray.push({ name, date, type });
  });
  return msArray;
}
milestoneList.addEventListener('click', (e) => {
  if (e.target.classList.contains('remove-ms')) {
    const index = parseInt(e.target.dataset.index);
    const current = collectMilestones();
    current.splice(index, 1);
    renderMilestones(current);
  }
});
document.getElementById('addMilestoneBtn').onclick = () => {
  const current = collectMilestones();
  current.push({ name: '', date: formatDate(new Date()), type: 'customer' });
  renderMilestones(current);
};

function openModal(title, task = null) {
  document.getElementById('modalTitle').textContent = title;
  const currentProj = getCurrentProject();
  if (!currentProj) return alert('请先创建一个项目');
  
  let depOptions = '<option value="">无依赖</option>';
  currentProj.tasks.forEach(t => {
    if (task && t.id === task.id) return;
    depOptions += `<option value="${t.id}">${esc(t.name)}</option>`;
  });
  mDependency.innerHTML = depOptions;

  if (task) {
    editingId = task.id;
    mName.value = task.name; mStart.value = task.start; mEnd.value = task.end;
    mStart2.value = task.start2 || ''; mEnd2.value = task.end2 || '';
    mOwner.value = task.owner || ''; mProgress.value = task.progress || 0;
    mColor.value = task.color || '#c8662f'; mDependency.value = task.dependencyId || '';
    renderMilestones(task.milestones || []);
  } else {
    editingId = null;
    const today = new Date();
    const nextWeek = new Date(today); nextWeek.setDate(today.getDate() + 6);
    mName.value = ''; mStart.value = formatDate(today); mEnd.value = formatDate(nextWeek);
    mStart2.value = ''; mEnd2.value = ''; mOwner.value = ''; mProgress.value = 0;
    mColor.value = '#c8662f'; mDependency.value = ''; renderMilestones([]);
  }
  overlay.classList.add('show');
  setTimeout(() => mName.focus(), 30);
}

function closeModal() { overlay.classList.remove('show'); editingId = null; }

document.getElementById('addTaskBtn').onclick = () => {
  if (!getCurrentProject()) return alert('请先点击“＋ 项目”创建一个项目');
  openModal('新建任务');
};
document.getElementById('mCancel').onclick = closeModal;
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });

document.getElementById('mSave').onclick = () => {
  const currentProj = getCurrentProject();
  if (!currentProj) return;

  const name = mName.value.trim();
  if (!name) { alert('请输入任务名称'); return; }
  if (mStart.value > mEnd.value) { alert('阶段1：开始日期不能晚于结束日期'); return; }
  if (mStart2.value && mEnd2.value && mStart2.value > mEnd2.value) { alert('阶段2：开始日期不能晚于结束日期'); return; }

  const milestones = collectMilestones();
  const taskData = {
    name, start: mStart.value, end: mEnd.value, start2: mStart2.value, end2: mEnd2.value,
    owner: mOwner.value.trim(), progress: parseInt(mProgress.value) || 0,
    color: mColor.value, dependencyId: mDependency.value, milestones: milestones
  };

  if (editingId) {
    const task = currentProj.tasks.find(t => t.id === editingId);
    if (task) Object.assign(task, taskData);
  } else {
    currentProj.tasks.push({ id: uid(), ...taskData });
  }
  closeModal(); render(); saveState();
};

document.getElementById('mDelete').onclick = () => {
  if (!editingId) { closeModal(); return; }
  if (!confirm('确定删除这个任务吗？')) return;
  const currentProj = getCurrentProject();
  if (currentProj) {
    currentProj.tasks = currentProj.tasks.filter(t => t.id !== editingId);
    currentProj.tasks.forEach(t => { if (t.dependencyId === editingId) t.dependencyId = ''; });
  }
  closeModal(); render(); saveState();
};

function openEdit(id) {
  const currentProj = getCurrentProject();
  if (!currentProj) return;
  const task = currentProj.tasks.find(t => t.id === id);
  if (task) openModal('编辑任务', task);
}

/* =========================================================
   独立添加节点弹窗
   ========================================================= */
const nodeOverlay = document.getElementById('nodeOverlay');
const nodeTaskSelect = document.getElementById('nodeTaskSelect');
const nodeName = document.getElementById('nodeName');
const nodeDate = document.getElementById('nodeDate');
const nodeType = document.getElementById('nodeType');

document.getElementById('addNodeBtn').onclick = () => {
  const currentProj = getCurrentProject();
  if (!currentProj || currentProj.tasks.length === 0) return alert('请先创建至少一个任务');
  
  nodeTaskSelect.innerHTML = currentProj.tasks.map(t => 
    `<option value="${t.id}">${esc(t.name)}</option>`
  ).join('');
  
  nodeName.value = '';
  nodeDate.value = formatDate(new Date());
  nodeType.value = 'customer';
  nodeOverlay.classList.add('show');
  setTimeout(() => nodeName.focus(), 30);
};

document.getElementById('nodeCancel').onclick = () => nodeOverlay.classList.remove('show');
nodeOverlay.addEventListener('click', e => { if (e.target === nodeOverlay) nodeOverlay.classList.remove('show'); });

document.getElementById('nodeSave').onclick = () => {
  const currentProj = getCurrentProject();
  const taskId = nodeTaskSelect.value;
  const name = nodeName.value.trim();
  const date = nodeDate.value;
  const type = nodeType.value;

  if (!name) { alert('请输入节点名称'); return; }
  if (!date) { alert('请选择节点日期'); return; }

  const task = currentProj.tasks.find(t => t.id === taskId);
  if (task) {
    if (!task.milestones) task.milestones = [];
    task.milestones.push({ name, date, type });
    nodeOverlay.classList.remove('show');
    render();
    saveState();
    alert('✅ 节点已添加！');
  }
};

/* =========================================================
   项目选择器与备份导入
   ========================================================= */
const projectSelect = document.getElementById('projectSelect');
function renderProjectSelect() {
  projectSelect.innerHTML = state.projects.map(p => 
    `<option value="${p.id}" ${p.id === state.currentProjectId ? 'selected' : ''}>${esc(p.name)}</option>`
  ).join('');
}
projectSelect.onchange = (e) => {
  state.currentProjectId = e.target.value;
  saveState(); render();
};
document.getElementById('addProjectBtn').onclick = () => {
  const name = prompt('请输入新项目名称', '新项目');
  if (name === null) return;
  const newProj = { id: uid(), name: name.trim() || '未命名项目', tasks: [] };
  state.projects.push(newProj);
  state.currentProjectId = newProj.id;
  saveState(); renderProjectSelect(); render();
};

document.getElementById('backupBtn').onclick = () => {
  const dataStr = JSON.stringify(state, null, 2);
  const blob = new Blob([dataStr], { type: 'application/json' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `Empower项目排期_备份_${new Date().toISOString().slice(0,10)}.json`;
  link.click();
  URL.revokeObjectURL(link.href);
};

const importFileInput = document.getElementById('importFileInput');
document.getElementById('importBtn').onclick = () => importFileInput.click();

importFileInput.onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const importedData = JSON.parse(ev.target.result);
      if (importedData && Array.isArray(importedData.projects)) {
        if (confirm('导入会覆盖当前所有项目数据，确定吗？')) {
          state = importedData;
          if (!state.currentProjectId || !state.projects.some(p => p.id === state.currentProjectId)) {
            state.currentProjectId = state.projects[0]?.id;
          }
          saveState(); renderProjectSelect(); render();
          alert('✅ 数据导入成功！');
        }
      } else {
        alert('❌ 文件格式错误：这不是有效的项目排期备份文件。');
      }
    } catch (err) { alert('❌ 读取失败：文件可能已损坏。'); }
  };
  reader.readAsText(file);
  importFileInput.value = '';
};

document.getElementById('resetBtn').onclick = () => {
  if (!confirm('确定清空所有数据并恢复示例吗？')) return;
  state = defaultData();
  state.currentProjectId = state.projects[0].id;
  renderProjectSelect(); render(); saveState();
};

let resizeTimer;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 200); });

// 初始化
renderProjectSelect();
render();
</script>
